nameOverride: greenhouse

alerts:
  enabled: true

controllerManager:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  image:
    repository: ghcr.io/cloudoperators/greenhouse
    # Overrides the image tag whose default is the chart appVersion.
    # tag:
    # Overrides the image tag to use a specific digest instead
    # digest: ""
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  args: []
  env: []
  replicas: 3
  serviceAccount:
    annotations: {}
  artifactStorage:
    path: /tmp/data
    sizeLimit: 1Gi
  config:
    plugin:
      maxConcurrentReconciles: 10
    pluginPreset:
      maxConcurrentReconciles: 10
    cluster:
      maxConcurrentReconciles: 5
    catalog:
      maxConcurrentReconciles: 5
    team:
      maxConcurrentReconciles: 5
    teamRoleBinding:
      maxConcurrentReconciles: 5
    bootstrap:
      maxConcurrentReconciles: 5
    kubeconfig:
      maxConcurrentReconciles: 1
    pluginDefinition:
      maxConcurrentReconciles: 10
    clusterPluginDefinition:
      maxConcurrentReconciles: 5

webhook:
  replicas: 2
  service:
    type: ClusterIP
    ports:
      - port: 443
        protocol: TCP
        targetPort: 9443
