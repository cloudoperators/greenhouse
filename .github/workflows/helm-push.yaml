name: Package Helm Chart and publish to GitHub Packages

on:
  push:
    tags:
      - "helm-chart-*.*.*"
    paths:
      - 'charts/**'

jobs:
  helm-release-greenhouse:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@4a36aa4e13e96d49b6d17f29da005f6cdb42b15b
    permissions:
      contents: read
      packages: write
    with:
      chart-dir: charts/greenhouse
      chart-name: greenhouse
      run-dependency-update: true
