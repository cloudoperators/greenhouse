name: Issue Project Sync
on:
  workflow_dispatch: {}
  # Fork dev: manual-only. Removed issues trigger (needs GH_PROJECT_TOKEN PAT, writes to a project board).

permissions:
  issues: read

jobs:
  sync:
    if: github.event.label.name == 'backlog'
    runs-on: ubuntu-latest
    steps:
      - uses: cloudoperators/common/workflows/issue-project-sync@f87e1e6b7889707a9c10d1a8a9f9f481eb311c06 # main
        with:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}