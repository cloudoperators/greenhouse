image:
  repository: greenhouse/manager
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: NodePort
  port: 9443
  nodePort: 32443

tls:
  enabled: false
  useSecret: false

volumes: []

volumeMounts: []

env:
  - name: AUTHZ_TLS_DISABLED
    value: "true"

ha:
  enabled: false